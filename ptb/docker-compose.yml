version: "3.9"

services:
  ptb:
    build: .
    ports:
      - "8788:8788"
    env_file:
      - .env
    volumes:
      # Mount Claude Code binary from host
      - ${CLAUDE_BIN_HOST:-/usr/local/bin/claude}:/usr/local/bin/claude:ro
      # Mount las binary from host
      - ${LAS_BIN_HOST:-/usr/local/bin/las}:/usr/local/bin/las:ro
      # Persistent job logs
      - ptb_jobs:/tmp/ptb_jobs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ptb_jobs:
